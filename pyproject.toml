[project]
name = "jev-agent-browser"
version = "0.1.0"
description = "Jev policy decisions executed through Agent Browser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.28,<1"]

[project.scripts]
jev-agent-browser = "jev_agent_browser.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_agent_browser"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
